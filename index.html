<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Código de Barras + Consulta de Produto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 1.4rem; color: #222; margin-bottom: 16px; }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            position: relative;
        }
        #scanner-container video,
        #scanner-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #result {
            margin-top: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            padding: 12px;
            background: #fff;
            border-radius: 8px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            word-break: break-all;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        #result.erro { color: #b00020; background: #fbe9e7; }
        #result.sucesso { color: #0a7c2f; background: #e6f7ec; }
        #engine-badge {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #666;
            background: #e9ecef;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .controls { margin-top: 14px; }
        button {
            padding: 10px 22px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }

        /* ---- Campos do produto ---- */
        #produto-box {
            max-width: 500px;
            margin: 20px auto 0;
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: left;
            display: none; /* aparece só após detecção */
        }
        #produto-box.visivel { display: block; }
        #produto-box label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
        }
        #produto-box input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
            background: #fafafa;
        }
        #produto-box input:read-only { color: #222; }
        #produto-nao-encontrado {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fbe9e7;
            color: #b00020;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>📷 Leitor de Código de Barras</h1>

    <div id="scanner-container"></div>

    <div id="result">Aponte a câmera para o código...</div>
    <div id="engine-badge">Detectando motor...</div>

    <div class="controls">
        <button id="btn-reiniciar" style="display:none;">Ler novamente</button>
    </div>

    <!-- Campos preenchidos automaticamente -->
    <div id="produto-box">
        <label for="nomeProduto">Descrição do produto</label>
        <input type="text" id="nomeProduto" readonly placeholder="—">

        <label for="pluProduto">PLU</label>
        <input type="text" id="pluProduto" readonly placeholder="—">

        <label for="qtdProduto">Quantidade disponível</label>
        <input type="text" id="qtdProduto" readonly placeholder="—">

        <label for="itensCx">Itens / CX</label>
        <input type="text" id="itensCx" readonly placeholder="—">

        <div id="produto-nao-encontrado">❌ EAN não encontrado na planilha.</div>
    </div>

    <!-- Quagga2 via CDN (fallback) -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

    <script>
        // ============================================================
        // CONFIGURAÇÃO — LINK DO CSV PUBLICADO NO GOOGLE SHEETS
        // ============================================================
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqSbZzOQhbqCklK_vY3locHBlDoEU5nNBJBmFdrUt1Z5XjAsnt_XJvQajURlmOXcHtRcqtDrfmYfWU/pub?gid=1042974769&single=true&output=csv';

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        const resultEl = document.getElementById('result');
        const badgeEl = document.getElementById('engine-badge');
        const btnReiniciar = document.getElementById('btn-reiniciar');
        const container = document.querySelector('#scanner-container');
        const produtoBox = document.getElementById('produto-box');
        const naoEncontradoEl = document.getElementById('produto-nao-encontrado');

        let baseProdutos = {};   // { EAN: {plu, descricao, qtd, itens_cx} }
        let escaneando = false;
        let usandoNativo = false;
        let barcodeDetector = null;
        let nativeScanInterval = null;

        // ============================================================
        // CARREGAMENTO DA BASE (Google Sheets CSV)
        // ============================================================
        async function carregarBase() {
            try {
                const resp = await fetch(URL_CSV, { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const csv = await resp.text();
                baseProdutos = csvParaBase(csv);
                console.log('Base carregada:', Object.keys(baseProdutos).length, 'produtos');
            } catch (err) {
                console.error('Erro ao carregar base:', err);
                resultEl.textContent = '⚠️ Base de produtos não carregou. Verifique a planilha.';
                resultEl.className = 'erro';
            }
        }

        function csvParaBase(csv) {
            const linhas = parseCSV(csv);
            const base = {};
            // Colunas: A=0 EAN | B=1 PLU | C=2 DESCRIÇÃO | D=3 QTD | E=4 ITENS/CX
            for (let i = 0; i < linhas.length; i++) {
                const l = linhas[i];
                if (!l || l.length < 3) continue;
                const ean = (l[0] || '').trim();
                const plu = (l[1] || '').trim();
                const descricao = (l[2] || '').trim();
                const qtdRaw = (l[3] || '').trim();
                const itensRaw = (l[4] || '').trim();

                if (!/^\d{8,14}$/.test(ean)) continue;
                if (descricao.toUpperCase() === 'DESCRIÇÃO DE PRODUTO') continue;
                if (base[ean]) continue; // mantém o primeiro

                base[ean] = {
                    plu: plu || null,
                    descricao: descricao || '(sem descrição)',
                    qtd: qtdRaw === '' ? null : Number(qtdRaw),
                    itens_cx: itensRaw === '' ? null : Number(itensRaw)
                };
            }
            return base;
        }

        function parseCSV(texto) {
            const linhas = [];
            let campo = '', linha = [], dentroAspas = false;
            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                if (dentroAspas) {
                    if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
                    else if (c === '"') { dentroAspas = false; }
                    else { campo += c; }
                } else {
                    if (c === '"') dentroAspas = true;
                    else if (c === ',') { linha.push(campo); campo = ''; }
                    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
                    else if (c === '\r') { }
                    else { campo += c; }
                }
            }
            if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
            return linhas;
        }

        // ============================================================
        // PREENCHIMENTO DOS CAMPOS APÓS DETECÇÃO
        // ============================================================
        function preencherProduto(ean) {
            const prod = baseProdutos[ean];
            produtoBox.classList.add('visivel');

            if (prod) {
                document.getElementById('nomeProduto').value = prod.descricao;
                document.getElementById('pluProduto').value  = prod.plu ?? '';
                document.getElementById('qtdProduto').value  = prod.qtd ?? '';
                document.getElementById('itensCx').value     = prod.itens_cx ?? '';
                naoEncontradoEl.style.display = 'none';
                resultEl.textContent = '✅ ' + prod.descricao;
                resultEl.className = 'sucesso';
            } else {
                document.getElementById('nomeProduto').value = '';
                document.getElementById('pluProduto').value  = '';
                document.getElementById('qtdProduto').value  = '';
                document.getElementById('itensCx').value     = '';
                naoEncontradoEl.style.display = 'block';
                resultEl.textContent = '❌ EAN ' + ean + ' não encontrado';
                resultEl.className = 'erro';
            }
        }

        // ============================================================
        // DETECÇÃO DE SUPORTE À API NATIVA
        // ============================================================
        async function verificarSuporteNativo() {
            if (!('BarcodeDetector' in window)) return false;
            try {
                const formatos = await BarcodeDetector.getSupportedFormats();
                const formatosProduto = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
                return formatos.some(f => formatosProduto.includes(f));
            } catch { return false; }
        }

        // ============================================================
        // MOTOR 1: BarcodeDetector NATIVO
        // ============================================================
        async function iniciarNativo() {
            usandoNativo = true;
            badgeEl.textContent = 'Motor: Nativo (BarcodeDetector)';
            resultEl.textContent = 'Iniciando câmera...';
            resultEl.className = '';
            btnReiniciar.style.display = 'none';
            produtoBox.classList.remove('visivel');
            naoEncontradoEl.style.display = 'none';
            container.innerHTML = '';

            try {
                const video = document.createElement('video');
                video.setAttribute('autoplay', '');
                video.setAttribute('playsinline', '');
                video.muted = true;
                container.appendChild(video);

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play(); resolve(); };
                });

                const formatosSuportados = await BarcodeDetector.getSupportedFormats();
                const formatosDesejados = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'];
                const formatosFiltrados = formatosDesejados.filter(f => formatosSuportados.includes(f));

                if (formatosFiltrados.length === 0) throw new Error('Nenhum formato suportado.');

                barcodeDetector = new BarcodeDetector({ formats: formatosFiltrados });
                escaneando = true;
                resultEl.textContent = 'Aponte a câmera para o código...';

                nativeScanInterval = setInterval(async () => {
                    if (!escaneando || !barcodeDetector) return;
                    try {
                        const barcodes = await barcodeDetector.detect(video);
                        if (barcodes.length > 0) {
                            const codigo = barcodes[0].rawValue;
                            if (codigo && codigo.length >= 6) aoDetectar(codigo);
                        }
                    } catch (err) { /* frame ruim, ignora */ }
                }, 100);

            } catch (err) {
                console.error('Erro no motor nativo:', err);
                resultEl.textContent = '❌ Erro ao acessar a câmera. Use HTTPS e permita o acesso.';
                resultEl.className = 'erro';
                escaneando = false;
            }
        }

        // ============================================================
        // MOTOR 2: QUAGGA2 (FALLBACK)
        // ============================================================
        function iniciarQuagga() {
            usandoNativo = false;
            badgeEl.textContent = 'Motor: Quagga2 (fallback)';
            resultEl.textContent = 'Iniciando câmera...';
            resultEl.className = '';
            btnReiniciar.style.display = 'none';
            produtoBox.classList.remove('visivel');
            naoEncontradoEl.style.display = 'none';
            container.innerHTML = '';

            Quagga.init({
                inputStream: {
                    name: 'Live', type: 'LiveStream', target: container,
                    constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                },
                locator: { patchSize: 'medium', halfSample: true },
                numOfWorkers: navigator.hardwareConcurrency || 2,
                frequency: 10,
                decoder: {
                    readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader', 'code_39_reader']
                },
                locate: true
            }, function (err) {
                if (err) {
                    console.error('Erro ao iniciar Quagga:', err);
                    resultEl.textContent = '❌ Erro ao acessar a câmera. Use HTTPS e permita o acesso.';
                    resultEl.className = 'erro';
                    return;
                }
                Quagga.start();
                escaneando = true;
                resultEl.textContent = 'Aponte a câmera para o código...';
            });
        }

        // ============================================================
        // CALLBACK COMUM DE DETECÇÃO
        // ============================================================
        function aoDetectar(codigo) {
            if (!escaneando) return; // evita múltiplas chamadas
            console.log('Código detectado:', codigo);

            preencherProduto(codigo);

            if (navigator.vibrate) navigator.vibrate(200);

            pararScanner();
            btnReiniciar.style.display = 'inline-block';
        }

        // ============================================================
        // PARADA DO SCANNER
        // ============================================================
        function pararScanner() {
            if (!escaneando) return;
            escaneando = false;

            if (nativeScanInterval) {
                clearInterval(nativeScanInterval);
                nativeScanInterval = null;
            }
            if (!usandoNativo) {
                try { Quagga.stop(); } catch (e) { }
            }
            if (usandoNativo) {
                const video = container.querySelector('video');
                if (video && video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
            }
        }

        // ============================================================
        // BOTÃO REINICIAR
        // ============================================================
        btnReiniciar.addEventListener('click', () => {
            if (usandoNativo) iniciarNativo();
            else iniciarQuagga();
        });

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        (async function inicializar() {
            // 1) Carrega a base de produtos
            await carregarBase();

            // 2) Registra callback do Quagga (se disponível)
            if (typeof Quagga !== 'undefined') {
                Quagga.onDetected(function (resultado) {
                    if (!usandoNativo && escaneando) {
                        const codigo = resultado.codeResult.code;
                        if (codigo && codigo.length >= 6) aoDetectar(codigo);
                    }
                });
            }

            // 3) Escolhe o motor de leitura
            const suporteNativo = await verificarSuporteNativo();
            if (suporteNativo) {
                console.log('Usando BarcodeDetector nativo.');
                iniciarNativo();
            } else {
                console.log('BarcodeDetector indisponível. Usando Quagga2.');
                iniciarQuagga();
            }
        })();
    </script>
</body>
</html>
